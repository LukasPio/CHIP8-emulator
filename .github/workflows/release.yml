name: Portable releases

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl pkg-config libsdl2-dev gcc-mingw-w64-x86-64 zip xvfb xauth xdotool
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^project(chip8 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "$RELEASE_TAG" = "v$version"
      - run: make release
      - name: Test packaged Linux binary
        run: |
          python3 tests/smoke.py dist/chip8-*-linux-x86_64/chip8
          xvfb-run -a python3 tests/window_smoke.py dist/chip8-*-linux-x86_64/chip8 roms/test/1_chip8_logo.ch8
      - uses: actions/upload-artifact@v4
        with:
          name: portable-releases
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-releases
          path: dist
      - name: Test packaged Windows executable
        shell: pwsh
        run: |
          $archive = Get-Item dist/*-windows-x86_64.zip
          Expand-Archive $archive.FullName -DestinationPath dist/unpacked
          $exe = Get-ChildItem dist/unpacked -Recurse -Filter chip8.exe
          python tests/smoke.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-releases
          path: dist
      - name: Publish Windows and Linux downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS
